services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: foodscan-postgres
    environment:
      POSTGRES_USER: foodscan_user
      POSTGRES_PASSWORD: foodscan_password
      POSTGRES_DB: foodscan_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodscan_user -d foodscan_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodscan-network
    restart: unless-stopped

  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: foodscan-backend
    environment:
      - DATABASE_URL=postgresql://foodscan_user:foodscan_password@postgres:5432/foodscan_db
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/models/models_yolo:/app/app/models/models_yolo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foodscan-network
    restart: unless-stopped

  # Frontend React (Pre-built)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: foodscan-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - foodscan-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: foodscan-nginx
    ports:
      - "9090:80"
      - "9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - foodscan-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  foodscan-network:
    driver: bridge